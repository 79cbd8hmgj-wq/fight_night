name: Build PPSSPP FFmpeg Runtime Bundle

on:
  push:
    branches:
      - ppsspp-ffmpeg-runtime-builder
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PPSSPP_REVISION: 49fb4f9b1a91bd210c2332958106a0bf6dc02c27
      SDL3_REVISION: 96292a5b464258a2b926e0a3d72f8b98c2a81aa6
      SDL3_TTF_REVISION: a1ce3670aec736ecbf0936c43f2f0cc53aa61e5b

    steps:
      - name: Check out bundle scripts
        uses: actions/checkout@v4

      - name: Install build dependencies including FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libglew-dev \
            libibus-1.0-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libsamplerate0-dev \
            libssl-dev \
            libswresample-dev \
            libswscale-dev \
            libudev-dev \
            libunwind-dev \
            libusb-1.0-0-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            ninja-build \
            patchelf \
            pkg-config \
            wayland-protocols
          cargo --version
          rustc --version
          getconf GNU_LIBC_VERSION
          pkg-config --modversion libavcodec libavformat libavutil libswresample libswscale

      - name: Build pinned SDL3
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/sdl-prefix"

          git clone --filter=blob:none https://github.com/libsdl-org/SDL.git sdl3
          cd sdl3
          git checkout --detach "$SDL3_REVISION"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$SDL3_REVISION"
          cd ..

          cmake -S sdl3 -B build-sdl3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_INSTALL=ON
          cmake --build build-sdl3 --parallel 4
          cmake --install build-sdl3

      - name: Build pinned SDL3_ttf
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/sdl-prefix"

          git clone --filter=blob:none https://github.com/libsdl-org/SDL_ttf.git sdl3-ttf
          cd sdl3-ttf
          git checkout --detach "$SDL3_TTF_REVISION"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$SDL3_TTF_REVISION"
          cd ..

          cmake -S sdl3-ttf -B build-sdl3-ttf -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDLTTF_INSTALL=ON \
            -DSDLTTF_SAMPLES=OFF \
            -DSDLTTF_VENDORED=OFF \
            -DSDLTTF_HARFBUZZ=OFF \
            -DSDLTTF_PLUTOSVG=OFF
          cmake --build build-sdl3-ttf --parallel 4
          cmake --install build-sdl3-ttf

      - name: Clone exact PPSSPP source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --recurse-submodules \
            https://github.com/hrydgard/ppsspp.git ppsspp
          cd ppsspp
          git fetch --tags --force
          git checkout --detach "$PPSSPP_REVISION"
          git submodule update --init --recursive
          resolved="$(git rev-parse HEAD)"
          test "$resolved" = "$PPSSPP_REVISION"
          printf '%s\n' "$resolved" | tee ../ppsspp-resolved-revision.txt
          test -z "$(git status --short)"
          test -f docs/WebSocketDebugger.md
          test -f Tools/wsdbg/Cargo.toml

      - name: Configure SDL debugger build with FFmpeg
        run: |
          prefix="$GITHUB_WORKSPACE/sdl-prefix"
          cmake -S ppsspp -B build-sdl -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DCMAKE_BUILD_RPATH="$prefix/lib" \
            -DHEADLESS=OFF \
            -DUNITTEST=OFF \
            -DUSE_DISCORD=OFF \
            -DUSE_FFMPEG=ON \
            -DUSE_SYSTEM_FFMPEG=ON \
            -DBUILD_BUNDLED_FFMPEG=OFF \
            -DUSE_MINIUPNPC=OFF
          grep -E '^(USE_FFMPEG|USE_SYSTEM_FFMPEG|BUILD_BUNDLED_FFMPEG):' build-sdl/CMakeCache.txt
          grep -q '^USE_FFMPEG:BOOL=ON$' build-sdl/CMakeCache.txt
          grep -q '^USE_SYSTEM_FFMPEG:BOOL=ON$' build-sdl/CMakeCache.txt

      - name: Build PPSSPPSDL and wsdbg
        run: |
          cmake --build build-sdl --target PPSSPPSDL --parallel 4
          cargo build \
            --locked \
            --release \
            --manifest-path ppsspp/Tools/wsdbg/Cargo.toml

      - name: Package validated runtime bundle
        run: |
          set -euo pipefail

          prefix="$GITHUB_WORKSPACE/sdl-prefix"
          prefix_libs="$(find "$prefix" -type f -name 'libSDL3*.so*' -printf '%h\n' | sort -u | paste -sd: -)"
          export LD_LIBRARY_PATH="$prefix_libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          sdl="$(find build-sdl -type f -name PPSSPPSDL -perm -111 | head -n 1)"
          wsdbg="ppsspp/Tools/wsdbg/target/release/wsdbg"
          test -n "$sdl"
          test -x "$wsdbg"

          mkdir -p bundle/assets bundle/lib
          cp "$sdl" bundle/PPSSPPSDL
          cp "$wsdbg" bundle/wsdbg
          cp -a ppsspp/assets/. bundle/assets/
          cp ppsspp/LICENSE.TXT bundle/PPSSPP-LICENSE.txt
          cp sdl3/LICENSE.txt bundle/SDL3-LICENSE.txt
          cp sdl3-ttf/LICENSE.txt bundle/SDL3-TTF-LICENSE.txt
          cp ppsspp-resolved-revision.txt bundle/ppsspp-resolved-revision.txt
          cp ppsspp/docs/WebSocketDebugger.md bundle/PPSSPP-WebSocket-Debugger.md
          cp ppsspp/Tools/wsdbg/README.md bundle/wsdbg-README.md
          chmod +x bundle/PPSSPPSDL bundle/wsdbg

          for binary in bundle/PPSSPPSDL bundle/wsdbg; do
            ldd "$binary" > "$binary.ldd.txt"
            test -z "$(grep 'not found' "$binary.ldd.txt" || true)"
            while IFS= read -r library; do
              test -f "$library" || continue
              base="$(basename "$library")"
              case "$base" in
                ld-linux*|libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|libutil.so.*)
                  continue
                  ;;
              esac
              cp -L "$library" "bundle/lib/$base"
            done < <(
              ldd "$binary" \
                | awk '/=> \/[^ ]+/ {print $3} /^\// {print $1}' \
                | sort -u
            )
            patchelf --set-rpath '$ORIGIN/lib' "$binary"
          done

          export LD_LIBRARY_PATH="$PWD/bundle/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bundle/PPSSPPSDL --version > bundle/PPSSPPSDL.version.txt 2>&1
          bundle/PPSSPPSDL --help > bundle/PPSSPPSDL.help.txt 2>&1 || true
          bundle/wsdbg --help > bundle/wsdbg.help.txt
          ldd bundle/PPSSPPSDL > bundle/PPSSPPSDL.after-bundle.ldd.txt
          test -z "$(grep 'not found' bundle/PPSSPPSDL.after-bundle.ldd.txt || true)"
          grep -Eq 'libavcodec|libavformat' bundle/PPSSPPSDL.after-bundle.ldd.txt

          cat > bundle/README.txt <<'EOF'
          Fight Night Round 3 PPSSPP runtime-debug bundle.

          Exact PPSSPP revision:
          49fb4f9b1a91bd210c2332958106a0bf6dc02c27

          This build differs from the earlier research bundle only by enabling
          system FFmpeg support required for PSP MPEG/PSMF playback.

          Launch example:
          ./PPSSPPSDL --debugger=20000 /path/to/game.iso
          EOF

          (
            cd bundle
            find . -type f ! -name bundle.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > bundle.sha256
            sha256sum -c bundle.sha256
          )

          tar -C bundle -czf ppsspp-debugger-ffmpeg-linux-x86_64.tar.gz .
          sha256sum ppsspp-debugger-ffmpeg-linux-x86_64.tar.gz \
            > ppsspp-debugger-ffmpeg-linux-x86_64.tar.gz.sha256

      - name: Upload runtime debugger bundle
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-debugger-ffmpeg-linux-x86_64
          path: |
            ppsspp-debugger-ffmpeg-linux-x86_64.tar.gz
            ppsspp-debugger-ffmpeg-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
