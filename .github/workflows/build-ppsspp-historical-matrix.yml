name: Build PPSSPP Historical Matrix

on:
  pull_request:
    paths:
      - .github/workflows/build-ppsspp-historical-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PPSSPP ${{ matrix.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version:
          - v1.18.1
          - v1.17.1
          - v1.16.6
          - v1.14.4

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libpulse-dev \
            libsdl2-dev \
            libsdl2-ttf-dev \
            libssl-dev \
            libswresample-dev \
            libswscale-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            ninja-build \
            patchelf \
            pkg-config
          getconf GNU_LIBC_VERSION

      - name: Clone exact historical tag
        env:
          PPSSPP_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/hrydgard/ppsspp.git ppsspp
          cd ppsspp
          git fetch --depth=1 origin \
            "refs/tags/${PPSSPP_VERSION}:refs/tags/${PPSSPP_VERSION}"
          git checkout --detach "$PPSSPP_VERSION"
          git submodule update --init --recursive --depth=1
          git rev-parse HEAD | tee ../ppsspp-resolved-revision.txt
          git describe --tags --always | tee ../ppsspp-resolved-version.txt
          test -f b.sh
          test -d assets

      - name: Configure historical SDL build
        run: |
          set -euo pipefail
          cmake -S ppsspp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHEADLESS=OFF \
            -DUNITTEST=OFF \
            -DUSE_DISCORD=OFF \
            -DUSE_MINIUPNPC=OFF

      - name: Build PPSSPPSDL
        run: |
          set -euo pipefail
          cmake --build build --target PPSSPPSDL --parallel 4

      - name: Package portable historical build
        env:
          PPSSPP_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          binary="$(find build -type f -name PPSSPPSDL -perm -111 | head -n 1)"
          test -n "$binary"

          bundle="bundle-${PPSSPP_VERSION}"
          mkdir -p "$bundle/assets" "$bundle/lib"
          cp "$binary" "$bundle/PPSSPPSDL"
          cp -a ppsspp/assets/. "$bundle/assets/"
          cp ppsspp/LICENSE.TXT "$bundle/PPSSPP-LICENSE.txt"
          cp ppsspp-resolved-revision.txt "$bundle/ppsspp-resolved-revision.txt"
          cp ppsspp-resolved-version.txt "$bundle/ppsspp-resolved-version.txt"
          chmod +x "$bundle/PPSSPPSDL"

          ldd "$bundle/PPSSPPSDL" > "$bundle/PPSSPPSDL.ldd.txt"
          test -z "$(grep 'not found' "$bundle/PPSSPPSDL.ldd.txt" || true)"
          while IFS= read -r library; do
            test -f "$library" || continue
            base="$(basename "$library")"
            case "$base" in
              ld-linux*|libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|libutil.so.*)
                continue
                ;;
            esac
            cp -L "$library" "$bundle/lib/$base"
          done < <(
            ldd "$bundle/PPSSPPSDL" \
              | awk '/=> \/[^ ]+/ {print $3} /^\// {print $1}' \
              | sort -u
          )
          patchelf --set-rpath '$ORIGIN/lib' "$bundle/PPSSPPSDL"

          export LD_LIBRARY_PATH="$PWD/$bundle/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$bundle/PPSSPPSDL" --version > "$bundle/PPSSPPSDL.version.txt" 2>&1 || true
          "$bundle/PPSSPPSDL" --help > "$bundle/PPSSPPSDL.help.txt" 2>&1 || true
          printf '%s\n' \
            "Historical PPSSPP compatibility build: ${PPSSPP_VERSION}" \
            'Contains no game image, save data, or copyrighted game assets.' \
            > "$bundle/README.txt"

          (
            cd "$bundle"
            find . -type f ! -name bundle.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > bundle.sha256
            sha256sum -c bundle.sha256
          )

          tar -C "$bundle" -czf "ppsspp-${PPSSPP_VERSION}-linux-x86_64.tar.gz" .
          sha256sum "ppsspp-${PPSSPP_VERSION}-linux-x86_64.tar.gz" \
            > "ppsspp-${PPSSPP_VERSION}-linux-x86_64.tar.gz.sha256"

      - name: Upload historical build
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-${{ matrix.version }}-linux-x86_64
          path: |
            ppsspp-${{ matrix.version }}-linux-x86_64.tar.gz
            ppsspp-${{ matrix.version }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
