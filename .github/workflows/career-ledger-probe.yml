name: Career Ledger Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PSP analysis tools
        run: python -m pip install -e ".[psp-analysis,dev]" "spimdisasm>=1.42.4,<2"
      - name: Run bounded population source probe
        run: python tools/research/career_population_source_probe.py
