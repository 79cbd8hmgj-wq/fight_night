name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check config src tests
      - name: Run mypy
        run: python -m mypy src tests/unit

  psp-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PSP analysis extra
        run: python -m pip install -e ".[psp-analysis,dev]" "spimdisasm>=1.42.4,<2"
      - name: Verify locked PSP toolkit provenance
        run: |
          python - <<'PY'
          from fnr3_re.psp_toolchain import load_psp_toolchain

          info = load_psp_toolchain(allow_unpinned=False)
          assert info.revision_locked
          print(info.package_version, info.observed_revision)
          PY
      - name: Run bounded career form/reputation probe
        run: python tools/research/career_form_probe.py
      - name: Run bounded career injury persistence probe
        run: python tools/research/career_injury_probe.py
      - name: Run career availability research probe
        run: python tools/research/career_availability_probe.py
      - name: Run bounded championship research probe
        env:
          CHAMPIONSHIP_PROBE_COMPACT: special
        run: python tools/research/championship_probe.py
      - name: Run bounded retirement research probe
        run: python tools/research/career_retirement_probe.py
      - name: Run career weight movement research probe
        run: python tools/research/career_weight_movement_probe.py
      - name: Run career weight transition research probe
        run: python tools/research/career_weight_probe.py
      - name: Run career weight-class research probe
        run: python tools/research/career_weightclass_probe.py

      - name: Run PSP integration unit tests
        run: |
          python -m pytest \
            tests/unit/test_psp_toolchain.py \
            tests/unit/test_psp_modules.py \
            tests/unit/test_psp_module_linking.py \
            tests/unit/test_psp_evidence.py \
            tests/unit/test_psp_output.py \
            tests/unit/test_psp_modules_cli.py
