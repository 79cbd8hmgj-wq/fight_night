name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check config src tests
      - name: Run mypy
        run: python -m mypy src tests/unit

  psp-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PSP analysis extra
        run: python -m pip install -e ".[psp-analysis,dev]"
      - name: Verify locked PSP toolkit provenance
        run: |
          python - <<'PY'
          from fnr3_re.psp_toolchain import load_psp_toolchain

          info = load_psp_toolchain(allow_unpinned=False)
          assert info.revision_locked
          print(info.package_version, info.observed_revision)
          PY
      - name: Run PSP integration unit tests
        run: |
          python -m pytest \
            tests/unit/test_psp_toolchain.py \
            tests/unit/test_psp_modules.py \
            tests/unit/test_psp_module_linking.py \
            tests/unit/test_psp_evidence.py \
            tests/unit/test_psp_output.py \
            tests/unit/test_psp_modules_cli.py

  payload-manifest-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate reviewed runtime allowlist preview
        run: |
          python tools/generate_runtime_payload_manifest.py \
            . \
            "$RUNNER_TEMP/ulus10066-repository-payload.json"
      - name: Summarize preview
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "ulus10066-repository-payload.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          entries = payload["entries"]
          print(f"files={len(entries)} bytes={sum(entry['size'] for entry in entries)}")
          print(f"first={entries[0]['source']} -> {entries[0]['destination']}")
          print(f"last={entries[-1]['source']} -> {entries[-1]['destination']}")
          PY
      - name: Upload allowlist preview
        uses: actions/upload-artifact@v4
        with:
          name: runtime-payload-manifest-preview
          path: ${{ runner.temp }}/ulus10066-repository-payload.json
          if-no-files-found: error
          retention-days: 1
