name: Task 5 BIG4 header trailer

on:
  push:
    branches:
      - task-5-resource-codecs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-5-resource-codecs
      - name: Preserve archive header trailer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fnr3_re/ea_archive.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''class EaArchive:\n    magic: bytes\n    total_size: int\n    header_size: int\n    alignment: int\n''',
                  '''class EaArchive:\n    magic: bytes\n    total_size: int\n    header_size: int\n    header_tail: bytes\n    alignment: int\n''',
              ),
              (
                  '''    if position != header_size:\n        raise EaArchiveError(\n            f"archive header size mismatch: directory ends at {position}, "\n            f"header ends at {header_size}"\n        )\n\n    ranges:''',
                  '''    if position > header_size:\n        raise EaArchiveError(\n            f"archive header size mismatch: directory ends at {position}, "\n            f"header ends at {header_size}"\n        )\n    header_tail = data[position:header_size]\n\n    ranges:''',
              ),
              (
                  '''        header_size=header_size,\n        alignment=_infer_alignment(raw_members, magic),\n''',
                  '''        header_size=header_size,\n        header_tail=header_tail,\n        alignment=_infer_alignment(raw_members, magic),\n''',
              ),
              (
                  '''    magic: bytes = b"BIGF",\n    alignment: int | None = None,\n) -> bytes:''',
                  '''    magic: bytes = b"BIGF",\n    alignment: int | None = None,\n    header_tail: bytes | bytearray | memoryview = b"",\n) -> bytes:''',
              ),
              (
                  '''    normalized: list[tuple[str, bytes, bytes]] = []\n    seen_names: set[str] = set()\n    header_size = 16\n''',
                  '''    normalized: list[tuple[str, bytes, bytes]] = []\n    seen_names: set[str] = set()\n    trailer = bytes(header_tail)\n    header_size = 16\n''',
              ),
              (
                  '''        normalized.append((name, encoded_name, member_data))\n        header_size += 8 + len(encoded_name) + 1\n\n    cursor = _align(header_size, selected_alignment)\n''',
                  '''        normalized.append((name, encoded_name, member_data))\n        header_size += 8 + len(encoded_name) + 1\n    header_size += len(trailer)\n\n    cursor = _align(header_size, selected_alignment)\n''',
              ),
              (
                  '''        output[position] = 0\n        position += 1\n        output[offset : offset + len(member_data)] = member_data\n    if position != header_size:\n''',
                  '''        output[position] = 0\n        position += 1\n        output[offset : offset + len(member_data)] = member_data\n    output[position : position + len(trailer)] = trailer\n    position += len(trailer)\n    if position != header_size:\n''',
              ),
              (
                  '''        magic=archive.magic,\n        alignment=archive.alignment,\n    )\n''',
                  '''        magic=archive.magic,\n        alignment=archive.alignment,\n        header_tail=archive.header_tail,\n    )\n''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected source block not found: {old[:60]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/integration/test_repository_ea_archives.py')
          test_text = test_path.read_text(encoding='utf-8')
          needle = '    assert archive.header_size == 0xE7\n'
          replacement = (
              needle
              + '    assert archive.header_tail == b"L266\\x15\\x05\\x00\\x01"\n'
          )
          if needle not in test_text:
              raise SystemExit('expected BIG4 integration assertion not found')
          test_path.write_text(test_text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fnr3_re/ea_archive.py tests/integration/test_repository_ea_archives.py
          git diff --cached --check
          git commit -m "fix: preserve BIG4 header trailer"
          git push origin HEAD:task-5-resource-codecs
