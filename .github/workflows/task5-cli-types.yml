name: Task 5 CLI types

on:
  push:
    branches:
      - task-5-resource-codecs

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-5-resource-codecs
      - name: Separate typed manifest variables
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fnr3_re/cli.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('        manifest = build_workspace(\n', '        workspace_manifest = build_workspace(\n'),
              ('            print(manifest.to_json(), end="")\n', '            print(workspace_manifest.to_json(), end="")\n'),
              ('                f"({len(manifest.files)} files, {len(manifest.directories)} directories)"\n', '                f"({len(workspace_manifest.files)} files, "\n                f"{len(workspace_manifest.directories)} directories)"\n'),
              ('        manifest = extract_ea_archive(archive, args.destination, force=args.force)\n', '        archive_manifest = extract_ea_archive(\n            archive, args.destination, force=args.force\n        )\n'),
              ('            print(json.dumps(manifest, indent=2, sort_keys=True), end="\\n")\n', '            print(json.dumps(archive_manifest, indent=2, sort_keys=True), end="\\n")\n'),
              ('            print(f"extracted: {args.destination} ({len(manifest)} members)")\n', '            print(\n                f"extracted: {args.destination} ({len(archive_manifest)} members)"\n            )\n'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected CLI block not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fnr3_re/cli.py
          git diff --cached --check
          git commit -m "types: separate resource manifest values"
          git push origin HEAD:task-5-resource-codecs
