name: Task 5 import order

on:
  push:
    branches:
      - task-5-resource-codecs

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-5-resource-codecs
      - name: Apply Ruff import ordering
        run: python -m pip install ruff && python -m ruff check --fix src/fnr3_re/ea_archive.py
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fnr3_re/ea_archive.py
          git diff --cached --check
          git commit -m "style: order archive codec imports"
          git push origin HEAD:task-5-resource-codecs
