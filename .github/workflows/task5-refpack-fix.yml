name: Task 5 RefPack fix

on:
  push:
    branches:
      - task-5-resource-codecs

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-5-resource-codecs
      - name: Correct literal partitioning
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fnr3_re/refpack.py')
          text = path.read_text(encoding='utf-8')
          old = '''        literal_length = min(\n            _MAX_LITERAL_RUN,\n            ((remaining - 3) // 4) * 4,\n        )\n'''
          new = '''        literal_length = min(\n            _MAX_LITERAL_RUN,\n            (remaining // 4) * 4,\n        )\n'''
          if old not in text:
              raise SystemExit('expected literal partition block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fnr3_re/refpack.py
          git diff --cached --check
          git commit -m "fix: partition RefPack literal prefixes"
          git push origin HEAD:task-5-resource-codecs
