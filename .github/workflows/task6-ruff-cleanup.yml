name: Task 6 Ruff cleanup

on:
  push:
    branches:
      - task-6-no-change-rebuild

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-6-no-change-rebuild
      - name: Apply bounded cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/fnr3_re/rebuild.py')
          text = source.read_text(encoding='utf-8')
          text = text.replace('import os\nimport shutil\nimport uuid\n', 'import os\nimport uuid\n', 1)
          text = text.replace(
              'from collections.abc import Mapping, Sequence\n',
              'from collections.abc import Mapping\n',
              1,
          )
          source.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/test_rebuild.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '    first = rebuild_image(reference, workspace, first_output, revision, BuildPlan.empty("fixture-v1"))\n',
              '    first = rebuild_image(\n'
              '        reference,\n'
              '        workspace,\n'
              '        first_output,\n'
              '        revision,\n'
              '        BuildPlan.empty("fixture-v1"),\n'
              '    )\n',
              1,
          )
          text = text.replace(
              'from fnr3_re.rebuild import (\n',
              'from fnr3_re.rebuild import (\n',
              1,
          )
          text = text.replace(
              'from tests.support.psp_iso import SECTOR_SIZE, write_reference\n',
              'from fnr3_re.revision import ReferenceRevision\n'
              'from tests.support.psp_iso import SECTOR_SIZE, write_reference\n',
              1,
          )
          text = text.replace(
              'def prepare_workspace(tmp_path: Path) -> tuple[Path, Path, object, bytes]:\n',
              'def prepare_workspace(\n'
              '    tmp_path: Path,\n'
              ') -> tuple[Path, Path, ReferenceRevision, bytes]:\n',
              1,
          )
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fnr3_re/rebuild.py tests/unit/test_rebuild.py
          git diff --cached --check
          git commit -m "style: clean rebuild pipeline"
          git push origin HEAD:task-6-no-change-rebuild
