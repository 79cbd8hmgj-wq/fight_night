name: Task 6 workspace output guard

on:
  push:
    branches:
      - task-6-no-change-rebuild

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-6-no-change-rebuild
      - name: Guard outputs from workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/fnr3_re/rebuild.py')
          text = source.read_text(encoding='utf-8')
          old_call = '    _validate_output_paths(reference_image, output, selected_report_path)\n'
          new_call = (
              '    _validate_output_paths(\n'
              '        reference_image, workspace, output, selected_report_path\n'
              '    )\n'
          )
          if old_call not in text:
              raise SystemExit('output validation call not found')
          text = text.replace(old_call, new_call, 1)

          old_function = '''def _validate_output_paths(reference: Path, output: Path, report: Path) -> None:\n    reference_resolved = reference.resolve()\n    if output.resolve(strict=False) == reference_resolved:\n        raise BuildError("output path must not replace the reference image")\n    if report.resolve(strict=False) == reference_resolved:\n        raise BuildError("report path must not replace the reference image")\n    if output.resolve(strict=False) == report.resolve(strict=False):\n        raise BuildError("output and report paths must differ")\n'''
          new_function = '''def _validate_output_paths(\n    reference: Path,\n    workspace: Path,\n    output: Path,\n    report: Path,\n) -> None:\n    reference_resolved = reference.resolve()\n    output_resolved = output.resolve(strict=False)\n    report_resolved = report.resolve(strict=False)\n    workspace_resolved = workspace.resolve()\n    if output_resolved == reference_resolved:\n        raise BuildError("output path must not replace the reference image")\n    if report_resolved == reference_resolved:\n        raise BuildError("report path must not replace the reference image")\n    if output_resolved == report_resolved:\n        raise BuildError("output and report paths must differ")\n    for label, candidate in (("output", output_resolved), ("report", report_resolved)):\n        if os.path.commonpath((str(workspace_resolved), str(candidate))) == str(\n            workspace_resolved\n        ):\n            raise BuildError(f"{label} path must be outside workspace")\n'''
          if old_function not in text:
              raise SystemExit('output validation function not found')
          source.write_text(text.replace(old_function, new_function, 1), encoding='utf-8')

          tests = Path('tests/unit/test_rebuild.py')
          text = tests.read_text(encoding='utf-8')
          insertion = '''\n\ndef test_output_and_report_must_remain_outside_workspace(tmp_path: Path) -> None:\n    reference, workspace, revision, _image = prepare_workspace(tmp_path)\n    plan = BuildPlan.empty("fixture-v1")\n    output_inside = workspace / "modified" / "rebuilt.iso"\n    report_inside = workspace / "modified" / "report.json"\n\n    with pytest.raises(BuildError, match="output path must be outside workspace"):\n        rebuild_image(reference, workspace, output_inside, revision, plan)\n    with pytest.raises(BuildError, match="report path must be outside workspace"):\n        rebuild_image(\n            reference,\n            workspace,\n            tmp_path / "outside.iso",\n            revision,\n            plan,\n            report_path=report_inside,\n        )\n    assert not output_inside.exists()\n    assert not report_inside.exists()\n'''
          marker = '\n\ndef test_plan_json_is_strict_and_deterministic(tmp_path: Path) -> None:\n'
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          tests.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')
          PY
      - name: Commit guard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fnr3_re/rebuild.py tests/unit/test_rebuild.py
          git diff --cached --check
          git commit -m "safety: keep rebuild outputs outside workspace"
          git push origin HEAD:task-6-no-change-rebuild
