name: Task 7 finalize static map

on:
  push:
    branches:
      - task-7-module-address-map

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-7-module-address-map
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded lint and type cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          elf = Path('src/fnr3_re/elf32.py')
          text = elf.read_text(encoding='utf-8')
          text = text.replace(
              'from dataclasses import dataclass\nfrom typing import Final\n',
              'from dataclasses import dataclass\nfrom itertools import pairwise\nfrom typing import Final\n',
              1,
          )
          text = text.replace(
              '    for previous, current in zip(load_ranges, load_ranges[1:], strict=False):\n',
              '    for previous, current in pairwise(load_ranges):\n',
              1,
          )
          old = '''        if section.section_type != SHT_NOBITS:\n            if (\n                section.file_offset > file_size\n                or section.size > file_size - section.file_offset\n            ):\n                raise Elf32Error(f"section {section.index} file range is outside ELF")\n'''
          new = '''        if section.section_type != SHT_NOBITS and (\n            section.file_offset > file_size\n            or section.size > file_size - section.file_offset\n        ):\n            raise Elf32Error(f"section {section.index} file range is outside ELF")\n'''
          if old not in text:
              raise SystemExit('expected nested section validation block not found')
          elf.write_text(text.replace(old, new, 1), encoding='utf-8')

          module_map = Path('src/fnr3_re/module_map.py')
          text = module_map.read_text(encoding='utf-8')
          text = text.replace(
              'from .manifests import ManifestFile, load_workspace_manifest\n',
              'from .manifests import load_workspace_manifest\n',
              1,
          )
          module_map.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/test_elf32.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'import pytest\n',
              'import pytest\nfrom collections.abc import Callable\n',
              1,
          )
          text = text.replace(
              'def test_rejects_malformed_or_unsupported_elfs(mutator: object, message: str) -> None:\n',
              'def test_rejects_malformed_or_unsupported_elfs(\n    mutator: Callable[[bytearray], None], message: str\n) -> None:\n',
              1,
          )
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Install project and generate exact static evidence
        run: |
          python -m pip install -e .
          python - <<'PY'
          from pathlib import Path
          from fnr3_re.module_map import build_repository_module_map

          destination = Path('analysis/modules/tracked-module-map.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              build_repository_module_map(Path('.')).to_json(),
              encoding='utf-8',
          )
          PY
      - name: Commit finalized Task 7 static evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fnr3_re/elf32.py src/fnr3_re/module_map.py tests/unit/test_elf32.py analysis/modules/tracked-module-map.json
          git diff --cached --check
          git commit -m "evidence: finalize static PSP module map"
          git push origin HEAD:task-7-module-address-map
