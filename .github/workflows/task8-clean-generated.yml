name: Task 8 generated-file cleanup

on:
  push:
    branches:
      - task-8-ppsspp-capture-harness

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-8-ppsspp-capture-harness
      - name: Remove generated Python artifacts
        run: |
          rm -rf src/fnr3_re.egg-info
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests -type f -name '*.pyc' -delete
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m ruff check src tests
          python -m mypy src tests/unit
          git diff --check
      - name: Remove regenerated metadata and commit cleanup
        run: |
          rm -rf src/fnr3_re.egg-info
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests -type f -name '*.pyc' -delete
          rm -f .github/workflows/task8-clean-generated.yml
          if find src tests -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) | grep -q .; then
            echo 'generated Python artifacts remain' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore: remove Task 8 generated artifacts"
          git push origin HEAD:task-8-ppsspp-capture-harness
