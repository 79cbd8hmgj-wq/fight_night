name: Task 8 final verification

on:
  push:
    branches:
      - task-8-ppsspp-capture-harness

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-8-ppsspp-capture-harness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run complete verification
        run: |
          python -m pytest -q
          python -m ruff check src tests
          python -m mypy src tests/unit
          python -m compileall -q src tests
          git diff --check
      - name: Remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/task8-final-verify.yml
          git diff --cached --check
          git commit -m "ci: remove temporary Task 8 verifier"
          git push origin HEAD:task-8-ppsspp-capture-harness
