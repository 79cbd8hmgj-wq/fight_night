name: Task 8 Ruff debug

on:
  push:
    branches:
      - task-8-ppsspp-capture-harness

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-8-ppsspp-capture-harness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Capture Ruff output
        run: |
          mkdir -p analysis/debug
          python -m ruff check config src tests > analysis/debug/task8-ruff.txt 2>&1 || true
      - name: Commit Ruff output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/debug/task8-ruff.txt
          git diff --cached --check
          git commit -m "debug: capture Task 8 Ruff findings"
          git push origin HEAD:task-8-ppsspp-capture-harness
