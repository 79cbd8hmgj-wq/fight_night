name: Task 8 Ruff fix

on:
  push:
    branches:
      - task-8-ppsspp-capture-harness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-8-ppsspp-capture-harness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Ruff fixes
        run: |
          python -m pip install ruff
          python -m ruff check --fix src/fnr3_re/ppsspp.py tests/unit/test_ppsspp_harness.py
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fnr3_re/ppsspp.py tests/unit/test_ppsspp_harness.py
          git diff --cached --check
          git commit -m "style: clean PPSSPP harness imports"
          git push origin HEAD:task-8-ppsspp-capture-harness
