name: Task 9B mypy fix

on:
  push:
    branches:
      - task-9-save-architecture

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-9-save-architecture
      - name: Apply bounded loop-variable fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/fnr3_re/save_utility.py")
          text = path.read_text(encoding="utf-8")
          old = '''        for site in self.controller_sites:\n            if site.region.module != self.parameter_block.module:\n                raise ValueError("controller module must match parameter-block module")\n        for site in self.payload_buffer.callback_sites:\n            if site.region.module != self.parameter_block.module:\n                raise ValueError("callback module must match parameter-block module")\n'''
          new = '''        for controller_site in self.controller_sites:\n            if controller_site.region.module != self.parameter_block.module:\n                raise ValueError("controller module must match parameter-block module")\n        for callback_site in self.payload_buffer.callback_sites:\n            if callback_site.region.module != self.parameter_block.module:\n                raise ValueError("callback module must match parameter-block module")\n'''
          if old not in text:
              raise SystemExit("expected Task 9B loop block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m ruff check config src tests
          python -m mypy src tests/unit
          git diff --check
      - name: Commit verified fix and remove workflow
        run: |
          rm -rf src/fnr3_re.egg-info
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests -type f -name '*.pyc' -delete
          rm -f .github/workflows/task9b-mypy-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: satisfy strict Task 9B typing checks"
          git push origin HEAD:task-9-save-architecture
