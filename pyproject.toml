[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fnr3-re"
version = "0.1.0"
description = "Evidence-first Fight Night Round 3 PSP reverse-engineering tools"
requires-python = ">=3.11"
dependencies = [
  "pycdlib @ git+https://github.com/clalancette/pycdlib.git@5cd8f57225a844d922b8a87f3f444fb79117c2b6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]
psp-analysis = [
  "pspdisasm @ git+https://github.com/79cbd8hmgj-wq/PSP-disassembly-tool.git@b3a07f4d0880b7933f87a9557b5e0aa3f364fa5a",
]

[project.scripts]
fnr3-re = "fnr3_re.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests/unit"]
